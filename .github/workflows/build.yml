name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bin: u7zgui
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            bin: u7zgui.exe
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            bin: u7zgui
          - os: macos-latest
            name: macos-x86_64
            target: x86_64-apple-darwin
            bin: u7zgui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        if: matrix.name != 'macos-x86_64'
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          tar -C dist -czf u7zgui-${{ matrix.name }}.tar.gz ${{ matrix.bin }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin }} -DestinationPath u7zgui-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: u7zgui-${{ matrix.name }}
          path: |
            u7zgui-${{ matrix.name }}.tar.gz
            u7zgui-${{ matrix.name }}.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: u7zgui-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "Universal 7-Zip GUI ${{ github.ref_name }}" --notes "Native Rust version (egui) with file manager right-click integration.

          Put the original 7-Zip console files (7zz / 7z / 7z.exe) next to the program. 7-Zip is not bundled, so updating it is just copying the new files over the old ones.

          Linux and macOS: extract the .tar.gz (keeps the executable bit). Windows: extract the .zip. Then Settings -> Add right-click menu entries.
          The Windows and macOS builds have been compiled by this workflow but not tested yet."

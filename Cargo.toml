[package]
name = "u7zgui"
version = "1.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui_extras = { version = "0.37.0", default-features = false }
libc = "0.2.191"
png = "0.18.1"
regex = "1.13.1"
serde_json = "1.0.154"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
